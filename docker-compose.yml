# 电力智能服务平台 基础设施
# 首次启动时 MySQL 会自动执行 ./sql 下的建表脚本（initdb.d 挂载）
services:
  mysql:
    image: mysql:8.0
    container_name: power-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    container_name: power-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: power-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 管理台 http://localhost:15672 guest/guest
    environment:
      TZ: Asia/Shanghai

volumes:
  mysql-data:
